[Container]
# Compose ForwardAuth at host time via Traefik labels. The base service
# unit stays generic; the protection rule is layered on by the host
# that wants it. Other hosts can re-use `whoami` without auth.
PodmanArgs=--label=traefik.enable=true
PodmanArgs=--label=traefik.http.routers.whoami.rule=Host(`whoami.example.com`)
PodmanArgs=--label=traefik.http.routers.whoami.entrypoints=websecure
PodmanArgs=--label=traefik.http.routers.whoami.middlewares=authelia@file
PodmanArgs=--label=traefik.http.services.whoami.loadbalancer.server.port=80
