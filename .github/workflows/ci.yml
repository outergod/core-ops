name: PR CI

on:
  pull_request:
  push:
    branches: ["master"]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build
        run: cargo build --locked --bin core-ops --bin core-ops-verify --bin core-ops-release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release Governance
        run: cargo run --bin core-ops-release -- validate --base-ref HEAD^
