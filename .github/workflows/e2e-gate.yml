name: E2E Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  e2e-gate:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, protected-e2e]
    environment: homelab-e2e
    permissions:
      contents: read
      pull-requests: read
    env:
      CORE_OPS_BUILD_SPEC_CONTEXT: "specs/010-distribution-readiness/spec.md"
      CORE_OPS_VERIFY_ENVIRONMENT_NAME: "fedora-coreos-self-hosted"
      CORE_OPS_VERIFY_ENVIRONMENT_VERSION: "2026-04-fcos"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build pinned verification binaries
        run: |
          cargo build --locked --bin core-ops --bin core-ops-verify
          target_dir="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          echo "CORE_OPS_VERIFY_CORE_OPS_BIN=${target_dir}/debug/core-ops" >> "$GITHUB_ENV"
          echo "CORE_OPS_VERIFY_BIN=${target_dir}/debug/core-ops-verify" >> "$GITHUB_ENV"

      - name: Accepted verification corpus
        run: |
          "$CORE_OPS_VERIFY_BIN" run \
            --accepted-dir tests/fixtures/verification/scenarios \
            --workspace-root /run/core-ops/verification/workspace \
            --artifacts-dir /run/core-ops/verification/artifacts \
            --ci --json

      - name: Spec and scenario conformance
        run: |
          "$CORE_OPS_VERIFY_BIN" validate \
            --spec specs/010-distribution-readiness/spec.md \
            --accepted-dir tests/fixtures/verification/scenarios

      - name: Determinism check
        run: |
          cargo test test_evaluation_determinism

      - name: Verification environment identity
        run: |
          : "${CORE_OPS_ACTUAL_VERIFY_ENVIRONMENT_NAME:?must be set by protected runner configuration}"
          : "${CORE_OPS_ACTUAL_VERIFY_ENVIRONMENT_VERSION:?must be set by protected runner configuration}"
          : "${CORE_OPS_ACTUAL_VERIFY_RUNNER_REF:?must be set by protected runner configuration}"
          : "${CORE_OPS_ACTUAL_VERIFY_SYSTEM_CLASS:?must be set by protected runner configuration}"
          "$CORE_OPS_VERIFY_BIN" validate-environment \
            --fixture tests/fixtures/distribution/release-gate-environment.json \
            --expected-name "$CORE_OPS_VERIFY_ENVIRONMENT_NAME" \
            --expected-version "$CORE_OPS_VERIFY_ENVIRONMENT_VERSION" \
            --actual-name "$CORE_OPS_ACTUAL_VERIFY_ENVIRONMENT_NAME" \
            --actual-version "$CORE_OPS_ACTUAL_VERIFY_ENVIRONMENT_VERSION" \
            --actual-runner-ref "$CORE_OPS_ACTUAL_VERIFY_RUNNER_REF" \
            --actual-system-class "$CORE_OPS_ACTUAL_VERIFY_SYSTEM_CLASS"
