# Example placeholder Traefik static configuration.
# Layout version 1 deploys this file to /etc/traefik/traefik.yaml because
# service.yaml declares config-root: traefik.

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/traefik.yaml
    watch: false
