scenario_id: verify-upgrade-transition
title: Upgrade transition remains explainable
description: Applying a new revision preserves deterministic reporting.
scenario_classes:
  - upgrade_transition
source: candidate
behavioral_claim: Upgrading from one revision to another yields deterministic output.
rationale: Extends coverage for revision transitions.
environment:
  profile: single-blessed-vm
fixtures:
  repo_fixture: fixtures/repos/frontend
  revision_under_test: demo-uat-v3
  repository_evolution:
    history_fixture: tests/fixtures/verification/repos/frontend-history
    revisions:
      - demo-uat-v2
      - demo-uat-v3
    states:
      - valid
      - valid
    transition_expectations:
      - upgrade reporting remains deterministic
steps:
  - step_id: boot
    step_type: boot
    target: guest
  - step_id: apply
    step_type: coreops_action
    target: guest
    action:
      action: apply
      host: test-vm
      repository_source: fixture
      revision: demo-uat-v3
      mode: humane
assertions:
  - assertion_id: transition-summary
    assertion_type: output_contains
    target: guest
    expected_state: deterministic-transition
    failure_message: Upgrade summary drifted.
